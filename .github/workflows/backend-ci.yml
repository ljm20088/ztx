name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "gradle/**"
      - "**/*.gradle.kts"
      - "settings.gradle.kts"
      - "docker-compose.yml"
      - ".devcontainer/**"
      - ".env.example"
      - "README.md"
      - "ztx"
      - "docs/operations/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: JDK 21 · Gradle 9.7 · Kotlin 2.4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew --version | grep -F "Gradle 9.7.0"
          test "$(node --version)" = "v26.13.1"
          test "$(pnpm --version)" = "12.18.0"

      - name: Install frontend workspace dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate launcher and Compose configuration
        run: |
          bash -n ztx
          ./ztx help
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/post-create.sh
          docker compose config --quiet

      - name: Build and test
        run: ./gradlew --no-daemon clean test build

      - name: Start PostgreSQL with Docker Compose and verify health
        run: |
          docker compose up -d postgres
          for attempt in $(seq 1 30); do
            container_id="$(docker compose ps -q postgres)"
            if [ -n "$container_id" ]; then
              health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                echo "PostgreSQL 18.6 is healthy."
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Smoke test unified development and integrated launchers
        run: |
          set -euo pipefail
          export ZTX_DB_HOST=127.0.0.1
          export ZTX_DB_PORT=5432
          export ZTX_DB_NAME=ztx
          export ZTX_DB_USER=ztx
          export ZTX_DB_PASSWORD=ztx_local_dev_only
          export ZTX_DB_POOL_SIZE=10
          export ZTX_DB_MIGRATIONS=filesystem:database/migrations
          export ZTX_HTTP_HOST=127.0.0.1
          export ZTX_HTTP_PORT=8080
          export ZTX_WEB_PORT=5173
          export ZTX_DB_MIGRATE_ON_START=true

          cleanup() {
            ./ztx stop || true
          }
          trap cleanup EXIT

          echo "验证 ./ztx dev："
          ./ztx dev
          curl -fsS http://127.0.0.1:5173/ >/tmp/ztx-vite-home.html
          grep -F "/src/main.ts" /tmp/ztx-vite-home.html
          curl -fsS http://127.0.0.1:8080/health/ready | grep -F '"status":"READY"'
          api_status="$(curl -sS -o /tmp/ztx-proxy-api.json -w '%{http_code}' http://127.0.0.1:5173/api/v1/not-found)"
          test "$api_status" = "404"
          grep -F "NOT_FOUND" /tmp/ztx-proxy-api.json
          ./ztx stop

          echo "验证 ./ztx start（前端构建与启动分离）："
          pnpm --dir frontend build
          ./ztx start
          curl -fsS http://127.0.0.1:8080/ >/tmp/ztx-vertx-home.html
          grep -F "assets/" /tmp/ztx-vertx-home.html
          curl -fsS http://127.0.0.1:8080/health/ready | grep -F '"status":"READY"'
          curl -fsS http://127.0.0.1:8080/platform/login | grep -F "assets/"
          api_status="$(curl -sS -o /tmp/ztx-static-api.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/not-found)"
          test "$api_status" = "404"
          grep -F "NOT_FOUND" /tmp/ztx-static-api.json
          ./ztx stop
          echo "Unified launcher smoke tests passed."

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
