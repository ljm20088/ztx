name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node 26 · pnpm 12 · frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify toolchain and committed lockfile
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v26.13.1"
          test "$(pnpm --version)" = "12.18.0"
          test -f frontend/pnpm-lock.yaml
          git ls-files --error-unmatch frontend/pnpm-lock.yaml >/dev/null

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Unit and component tests
        working-directory: frontend
        run: pnpm test

      - name: Production build
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm --filter @ztx/erp-web exec playwright install chromium

      - name: Browser E2E tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report and visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-results
          path: |
            frontend/apps/erp-web/playwright-report/
            frontend/apps/erp-web/test-results/
            frontend/apps/erp-web/artifacts/frontend-visual-captures/
          if-no-files-found: ignore
          retention-days: 7
