# ZTX 默认配置。环境差异放在 application-{profile}.yaml 中。
app:
  role: server
server:
  host: 0.0.0.0
  port: 8080
database:
  host: localhost
  port: 5432
  name: ztx
  user: ztx
  password: ""
  pool-size: 10
  migrations: filesystem:database/migrations
  migrate-on-start: false
security:
  # 启用 MFA 时才需要配置；首次初始化和普通密码登录不依赖此密钥。
  mfa-encryption-key: ""
  secure-cookies: false
logging:
  level: INFO
