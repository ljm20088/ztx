services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ztx}
      POSTGRES_USER: ${POSTGRES_USER:-ztx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ztx_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ztx-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  app:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    profiles: ["devcontainer"]
    command: sleep infinity
    working_dir: /workspaces/ztx
    environment:
      ZTX_DB_HOST: postgres
      ZTX_DB_PORT: 5432
      ZTX_DB_NAME: ${POSTGRES_DB:-ztx}
      ZTX_DB_USER: ${POSTGRES_USER:-ztx}
      ZTX_DB_PASSWORD: ${POSTGRES_PASSWORD:-ztx_local_dev_only}
      ZTX_HTTP_HOST: 0.0.0.0
      ZTX_HTTP_PORT: 8080
    volumes:
      - .:/workspaces/ztx:cached
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ztx-postgres-data:
